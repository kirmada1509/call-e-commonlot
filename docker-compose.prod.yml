name: commonlot

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: commonlot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commonlot"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://commonlot.duckdns.org
      CALLE_API_KEY: ${CALLE_API_KEY:-}
      CORS_ORIGIN: https://commonlot.duckdns.org
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/commonlot
      NODE_ENV: production
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      default:
      proxy:
        aliases:
          - commonlot-server
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: https://commonlot.duckdns.org
    environment:
      NEXT_PUBLIC_SERVER_URL: https://commonlot.duckdns.org
      NODE_ENV: production
      PORT: 3001
      SERVER_URL: http://server:3000
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      default:
      proxy:
        aliases:
          - commonlot-web
    restart: unless-stopped

networks:
  proxy:
    external: true
    name: voice-runtime_default

volumes:
  postgres_data:
